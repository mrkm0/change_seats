<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放課後学習 席替えルーレット</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* カスタムフォントとアニメーションの設定 */
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #f0fdfa; /* 薄いミントグリーン */
            overflow: hidden; /* スクロール防止 */
        }

        /* 座席の基本スタイル */
        .seat {
            transition: all 0.1s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* シャッフル中のアニメーション（少し震える） */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .shuffling {
            animation: shake 0.5s infinite;
            background-color: #fde047; /* シャッフル中の色（黄色） */
            color: #854d0e;
            transform: scale(1.05);
        }

        /* 確定時のアニメーション（ポップアップ） */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); background-color: #fef08a; }
            100% { transform: scale(1); }
        }

        .settled {
            animation: pop 0.4s ease-out forwards;
            background-color: #ffffff !important;
            border: 4px solid #8cc63f !important;
            box-shadow: 0 6px 12px rgba(140, 198, 63, 0.3);
        }
        
        /* 空席のスタイル */
        .empty-seat {
            background-color: #f3f4f6;
            color: #9ca3af;
            border: 2px dashed #9ca3af;
        }

        /* 教卓のスタイル */
        .teacher-desk {
            background-image: repeating-linear-gradient(
                45deg,
                #d1d5db,
                #d1d5db 10px,
                #e5e7eb 10px,
                #e5e7eb 20px
            );
        }

        /* 特殊な座席配置のためのグリッド設定（5行4列をベースにする） */
        .custom-seating-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        /* 存在する座席のセル位置を指定 */
        .seat-pos-0 { grid-column: 1; grid-row: 1; }
        .seat-pos-1 { grid-column: 2; grid-row: 1; }
        .seat-pos-2 { grid-column: 4; grid-row: 1; }
        
        .seat-pos-3 { grid-column: 1; grid-row: 2; }
        .seat-pos-4 { grid-column: 2; grid-row: 2; }
        .seat-pos-5 { grid-column: 4; grid-row: 2; }
        
        .seat-pos-6 { grid-column: 1; grid-row: 3; }
        .seat-pos-7 { grid-column: 2; grid-row: 3; }
        .seat-pos-8 { grid-column: 4; grid-row: 3; }
        
        .seat-pos-9 { grid-column: 1; grid-row: 4; }
        .seat-pos-10 { grid-column: 2; grid-row: 4; }
        .seat-pos-11 { grid-column: 4; grid-row: 4; }
        
        .seat-pos-12 { grid-column: 1; grid-row: 5; }
        .seat-pos-13 { grid-column: 2; grid-row: 5; }
        .seat-pos-14 { grid-column: 3; grid-row: 5; }
        .seat-pos-15 { grid-column: 4; grid-row: 5; }

        /* 画像に合わせた緑色の基本スタイル */
        .seat-green {
            background-color: #8cc63f; /* 画像に近い黄緑色 */
            color: white;
            border: none;
        }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8 overflow-y-auto"> <!-- overflowを変更してスクロール可能に -->

    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-2xl p-6 md:p-10 text-center relative flex flex-col min-h-[90vh]">
        
        <!-- 装飾的な背景要素 -->
        <div class="absolute top-[-50px] left-[-50px] w-32 h-32 bg-blue-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob pointer-events-none"></div>
        <div class="absolute top-[-50px] right-[-50px] w-32 h-32 bg-yellow-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000 pointer-events-none"></div>
        <div class="absolute bottom-[-50px] left-20 w-32 h-32 bg-pink-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000 pointer-events-none"></div>

        <div class="flex-grow"> <!-- 上部コンテンツを押し上げるラッパー -->
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-2 relative z-10">✨ 席替えルーレット ✨</h1>
            <p class="text-emerald-800 font-bold text-lg md:text-xl mb-6 relative z-10 bg-emerald-100 inline-block px-5 py-1 rounded-full border border-emerald-300 shadow-sm">放課後トライ</p>

            <!-- ホワイトボード（画像に合わせて変更） -->
            <div class="mb-8 relative z-10 flex flex-col items-center">
                <div class="w-full max-w-3xl h-16 bg-white border-4 border-black mb-2 flex items-center justify-center">
                    <span class="text-black text-2xl font-bold tracking-widest">ホワイトボード</span>
                </div>
            </div>

            <!-- 座席エリア（特殊配置） -->
            <div id="seat-grid" class="custom-seating-grid mb-10 relative z-10 w-full px-4">
                <!-- JavaScriptで動的に生成されます -->
            </div>
        </div>

        <!-- コントロールボタン -->
        <div class="relative z-10 mt-auto pb-4">
            <button id="start-btn" class="bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-4 px-12 rounded-full text-2xl shadow-lg transform transition hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-300 w-full max-w-md mx-auto">
                席替えスタート！
            </button>
            <p id="status-text" class="mt-4 text-gray-600 font-bold h-6 text-lg"></p>
        </div>
    </div>

    <script>
        // 設定
        const TOTAL_SEATS = 16;
        const STUDENT_COUNT = 15; // 1組8人 + 2組7人
        const SHUFFLE_DURATION = 3000; // ルーレットが回る時間（ミリ秒）
        const UPDATE_INTERVAL = 80;    // 数字が切り替わる間隔（ミリ秒）

        // 要素の取得
        const seatGrid = document.getElementById('seat-grid');
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        // 音声コンテキスト（ユーザーインタラクション後に初期化する必要がある）
        let audioCtx;

        // 状態
        let isShuffling = false;
        let shuffleInterval;
        let currentSeatOrder = []; // 現在の座席の番号を保持
        
        // 座席を初期化して画面に表示する
        function initSeats() {
            seatGrid.innerHTML = ''; // クリア
            for (let i = 0; i < TOTAL_SEATS; i++) {
                const seatDiv = document.createElement('div');
                // クラスを動的に付与 (seat-greenを追加、デフォルトのborderなどを削除)
                seatDiv.className = `seat seat-green rounded-md h-20 sm:h-24 md:h-28 flex flex-col items-center justify-center text-3xl md:text-4xl font-bold relative seat-pos-${i}`;
                seatDiv.id = `seat-${i}`;
                
                const numberSpan = document.createElement('span');
                numberSpan.className = 'seat-number z-10';
                numberSpan.textContent = '?';
                seatDiv.appendChild(numberSpan);

                seatGrid.appendChild(seatDiv);
            }
            statusText.textContent = "ボタンを押してね！";
        }

        // ピコピコ音（シャッフル中）
        function playTickSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime); // ランダムな高い音
            
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // ジャーン音（決定時）
        function playTadaSound() {
            if (!audioCtx) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const osc3 = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            // 和音を作る
            osc1.type = 'triangle';
            osc2.type = 'triangle';
            osc3.type = 'triangle';
            
            osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc2.frequency.setValueAtTime(659.25, audioCtx.currentTime); // E5
            osc3.frequency.setValueAtTime(783.99, audioCtx.currentTime); // G5

            // 少しピッチベンドさせる
            osc1.frequency.linearRampToValueAtTime(523.25 * 1.05, audioCtx.currentTime + 0.2);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1); // フェードイン
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5); // ゆっくりフェードアウト

            osc1.connect(gain);
            osc2.connect(gain);
            osc3.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc1.start(); osc2.start(); osc3.start();
            osc1.stop(audioCtx.currentTime + 1.5);
            osc2.stop(audioCtx.currentTime + 1.5);
            osc3.stop(audioCtx.currentTime + 1.5);
        }

        // ドラムロール音（開始時）
        function playStartSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
        }

        // 配列をシャッフルする関数（Fisher-Yates アルゴリズム）
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 席替えスタート関数
        function startShuffle() {
            if (isShuffling) return;

            // AudioContextの初期化（初回クリック時のみ）
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isShuffling = true;
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusText.textContent = "シャッフル中...";
            
            playStartSound();

            // 1〜15の数字と、1つの空席(0またはnullとして扱う)を作成
            let numbers = [];
            for (let i = 1; i <= STUDENT_COUNT; i++) {
                numbers.push(i);
            }
            // 空席分を補充
            for (let i = 0; i < (TOTAL_SEATS - STUDENT_COUNT); i++) {
                numbers.push("空");
            }

            // 全ての座席にシャッフルアニメーション用のクラスを付与
            for (let i = 0; i < TOTAL_SEATS; i++) {
                const seat = document.getElementById(`seat-${i}`);
                seat.className = `seat rounded-md h-20 sm:h-24 md:h-28 flex flex-col items-center justify-center text-3xl md:text-4xl font-bold relative shuffling seat-pos-${i}`;
            }

            let ticks = 0;
            // 定期的に数字を更新する
            shuffleInterval = setInterval(() => {
                const tempShuffle = shuffleArray([...numbers]);
                for (let i = 0; i < TOTAL_SEATS; i++) {
                    const span = document.querySelector(`#seat-${i} .seat-number`);
                    span.textContent = tempShuffle[i];
                }
                
                // 音を鳴らす（毎回だと重いので少し間引く）
                if (ticks % 2 === 0) {
                    playTickSound();
                }
                ticks++;
            }, UPDATE_INTERVAL);

            // 指定時間後にシャッフルを停止し、結果を確定する
            setTimeout(() => {
                stopShuffle(numbers);
            }, SHUFFLE_DURATION);
        }

        // シャッフル停止と結果の確定
        function stopShuffle(finalNumbers) {
            clearInterval(shuffleInterval);
            
            // 最終的な配列をシャッフル
            currentSeatOrder = shuffleArray([...finalNumbers]);
            
            playTadaSound();

            // 座席ごとに順番にアニメーションを適用していく演出
            currentSeatOrder.forEach((num, index) => {
                // 少し時間差をつけて確定させていく
                setTimeout(() => {
                    const seat = document.getElementById(`seat-${index}`);
                    const span = seat.querySelector('.seat-number');
                    
                    span.textContent = num;
                    
                    // クラスのリセット (カスタム位置クラスを維持)
                    seat.className = `seat h-20 sm:h-24 md:h-28 flex flex-col items-center justify-center relative rounded-xl seat-pos-${index}`;
                    
                    // 空席か生徒かでスタイルを分ける
                    if (num === "空") {
                        seat.classList.add('empty-seat');
                        span.className = 'seat-number z-10 text-gray-400 font-bold text-lg sm:text-xl';
                        span.textContent = '空席';
                    } else {
                        seat.classList.add('settled');
                        // 確定時：くっきり見えやすいよう黒い太字に設定
                        span.className = 'seat-number z-10 text-gray-900 font-black text-4xl sm:text-5xl'; 
                    }

                    // 最後の座席が確定したらボタンを復活させる
                    if (index === TOTAL_SEATS - 1) {
                        setTimeout(() => {
                            isShuffling = false;
                            startBtn.disabled = false;
                            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                            startBtn.textContent = "もう一度席替え";
                            statusText.textContent = "新しい席が決定しました！";
                        }, 500); // 最後のポップアニメーションが終わるのを少し待つ
                    }
                }, index * 50); // 50msごとに次々と確定
            });
        }

        // イベントリスナー
        startBtn.addEventListener('click', startShuffle);

        // 初期化実行
        window.addEventListener('DOMContentLoaded', initSeats);

    </script>
</body>
</html>
